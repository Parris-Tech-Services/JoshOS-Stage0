name: Build Josh OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'
      - 'design/**'
      - 'iso/**'
      - 'scripts/**'
      - 'shell/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'
      - 'design/**'
      - 'iso/**'
      - 'scripts/**'
      - 'shell/**'

permissions:
  contents: read

concurrency:
  group: josh-os-stage0-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Validate generated shell assets and internet platform
        run: |
          bash -n scripts/build-iso.sh
          bash -n scripts/check-network-platform.sh
          bash -n iso/overlay/usr/local/bin/josh-network-check
          bash -n iso/overlay/usr/local/bin/josh-wifi
          bash -n iso/overlay/usr/local/bin/josh-network-acceptance
          python -m py_compile iso/overlay/usr/local/lib/josh-os/network-control.py
          python -m unittest discover -s iso/tests -p 'test_*.py'
          bash -n iso/overlay/usr/local/lib/josh-os/network-ready-probe
          bash -n scripts/smoke-network-platform.sh
          grep -q "/api/network/status" shell/apps.js
          grep -q "networkmanager" scripts/build-iso.sh
          grep -q "ca-certificates-mozilla" scripts/build-iso.sh
          grep -q "NetworkManager.service" scripts/build-iso.sh
          grep -q "systemd-timesyncd.service" scripts/build-iso.sh
          node scripts/build-tokens.mjs
          git diff --exit-code -- design/tokens.css
          node scripts/build-shell.mjs
          test -s dist/josh-os-shell.html

      - name: Build ISO in Arch Linux
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash -lc 'pacman -Syu --noconfirm archiso git && ./scripts/build-iso.sh'

      - name: Take ownership of build output
        run: sudo chown -R "$(id -u):$(id -g)" out

      - name: QEMU Internet smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          iso="$(ls -1 out/josh-os-*.iso | head -n1)"
          bash scripts/smoke-network-platform.sh "$iso" out/network-boot.log

      - name: Show ISO metadata
        run: |
          ls -lh out/*.iso
          sha256sum out/*.iso | tee out/SHA256SUMS

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: JoshOS-Stage0-Live-x86_64
          path: |
            out/*.iso
            out/SHA256SUMS
            out/network-boot.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
